stages:
    - build
    - test
    - versions
    - pypi
    - cleanup

variables:
    BUILD_BOX_NAME: build-box-gamma


Build:
    stage: build
    tags:
      - dind
    only:
      - master
      - merge_requests
      - tags
    script:
        - docker build -t $BUILD_BOX_NAME/app:$CI_COMMIT_SHORT_SHA .

Units:
    stage: test
    tags:
      - dind
    only:
      - master
      - merge_requests
      - tags
    script:
      - docker run $BUILD_BOX_NAME/app:$CI_COMMIT_SHORT_SHA sh -c 'make test'

ReactUnits:
    stage: test
    tags:
      - dind
    only:
      - master
      - merge_requests
      - tags
    script:
      - docker run $BUILD_BOX_NAME/app:$CI_COMMIT_SHORT_SHA sh -c 'make jest'

CheckVersion:
    stage: versions
    image: python:3.8
    script:
      - python check_version.py
    rules:
      - if: $CI_COMMIT_TAG

PyPiBuildAndPublish:
    stage: pypi
    tags:
      - dind
    script:
      - docker run -e CI_JOB_TOKEN -e CI_PROJECT_ID $BUILD_BOX_NAME/app:$CI_COMMIT_SHORT_SHA sh -c 'make pypi'
    rules:
      - if: $CI_COMMIT_TAG

CleanUp:
    stage: cleanup
    tags:
      - dind
    only:
      - master
      - merge_requests
      - tags
    script:
      - docker rmi -f $BUILD_BOX_NAME/app:$CI_COMMIT_SHORT_SHA || true
    when: always
